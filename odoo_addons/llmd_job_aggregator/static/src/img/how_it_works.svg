<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 210" fill="none" font-family="Inter, 'Segoe UI', Roboto, Arial, sans-serif">
  <defs>
    <linearGradient id="g1" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#2563eb"/><stop offset="1" stop-color="#7c3aed"/></linearGradient>
    <linearGradient id="g2" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#db2777"/><stop offset="1" stop-color="#f97316"/></linearGradient>
    <linearGradient id="g3" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#eef2ff"/><stop offset="1" stop-color="#ffffff"/></linearGradient>
    <filter id="sh" x="-20%" y="-20%" width="140%" height="160%"><feDropShadow dx="0" dy="8" stdDeviation="9" flood-color="#1e3a8a" flood-opacity=".18"/></filter>
  </defs>
  <!-- soft blobs -->
  <circle cx="112" cy="104" r="80" fill="#e0e7ff"/>
  <circle cx="470" cy="92" r="64" fill="#fce7f3"/>
  <circle cx="320" cy="140" r="44" fill="#ede9fe"/>
  <!-- dotted path: post -> live -> inbox -->
  <path d="M196 64 C 236 20, 290 22, 314 58 S 404 116, 440 84" stroke="#a5b4fc" stroke-width="2.5" stroke-dasharray="2 8" stroke-linecap="round"/>

  <!-- 1. laptop with the job form -->
  <g filter="url(#sh)">
    <rect x="34" y="34" width="164" height="114" rx="10" fill="#fff" stroke="#c7d2fe" stroke-width="2"/>
    <rect x="16" y="148" width="200" height="12" rx="6" fill="#c7d2fe"/>
  </g>
  <rect x="34" y="34" width="164" height="18" rx="10" fill="url(#g3)"/>
  <circle cx="46" cy="43" r="3" fill="#f87171"/><circle cx="56" cy="43" r="3" fill="#fbbf24"/><circle cx="66" cy="43" r="3" fill="#34d399"/>
  <text x="48" y="68" font-size="10.5" font-weight="800" fill="#1e3a8a">Post a job</text>
  <rect x="48" y="75" width="136" height="16" rx="5" fill="#f8fafc" stroke="#e2e8f0"/>
  <text x="55" y="86" font-size="7.5" fill="#64748b">Job title · AI Sales Executive</text>
  <rect x="48" y="96" width="64" height="16" rx="5" fill="#f8fafc" stroke="#e2e8f0"/>
  <text x="55" y="107" font-size="7.5" fill="#64748b">City · Noida</text>
  <rect x="118" y="96" width="66" height="16" rx="5" fill="#f8fafc" stroke="#e2e8f0"/>
  <text x="125" y="107" font-size="7.5" fill="#64748b">Full-time</text>
  <rect x="48" y="118" width="70" height="16" rx="5" fill="#fef2f2" stroke="#fecaca"/>
  <text x="55" y="129" font-size="7.5" fill="#b91c1c">JD.pdf attached</text>
  <rect x="134" y="118" width="50" height="16" rx="8" fill="url(#g1)"/>
  <text x="159" y="129" font-size="8" font-weight="700" fill="#fff" text-anchor="middle">Submit</text>
  <text x="116" y="184" font-size="10" font-weight="700" fill="#4338ca" text-anchor="middle">1 · You post</text>

  <!-- paper plane -->
  <g transform="translate(214 26) rotate(-12)">
    <path d="M0 14 L36 0 L26 32 L17 21 Z" fill="url(#g1)"/>
    <path d="M17 21 L36 0 L13 18 Z" fill="#fff" opacity=".45"/>
  </g>

  <!-- 2. live job card -->
  <g filter="url(#sh)">
    <rect x="250" y="66" width="146" height="74" rx="12" fill="#fff" stroke="#e0e7ff" stroke-width="1.5"/>
  </g>
  <rect x="250" y="66" width="146" height="5" rx="2.5" fill="url(#g1)"/>
  <rect x="262" y="82" width="24" height="24" rx="7" fill="url(#g1)"/>
  <rect x="268.5" y="89" width="11" height="9" rx="2" fill="#fff"/>
  <text x="293" y="91" font-size="9" font-weight="800" fill="#0f172a">AI Sales Executive</text>
  <text x="293" y="103" font-size="7.5" fill="#64748b">Your company · Noida</text>
  <rect x="262" y="115" width="30" height="13" rx="6.5" fill="#d1fae5"/>
  <text x="277" y="124.5" font-size="7.5" font-weight="800" fill="#047857" text-anchor="middle">Live</text>
  <rect x="297" y="115" width="44" height="13" rx="6.5" fill="#eef2ff"/>
  <text x="319" y="124.5" font-size="7.5" font-weight="700" fill="#4338ca" text-anchor="middle">30 days</text>
  <rect x="346" y="115" width="40" height="13" rx="6.5" fill="#f5f3ff"/>
  <text x="366" y="124.5" font-size="7.5" font-weight="700" fill="#6d28d9" text-anchor="middle">Checked</text>
  <circle cx="390" cy="70" r="13" fill="#10b981" stroke="#fff" stroke-width="3"/>
  <path d="M384 70 l4 4 l8 -8" stroke="#fff" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="323" y="184" font-size="10" font-weight="700" fill="#4338ca" text-anchor="middle">2 · We check, it goes live</text>

  <!-- 3. inbox with resumes -->
  <rect x="452" y="70" width="36" height="46" rx="5" fill="#fff" stroke="#e2e8f0" stroke-width="1.5" transform="rotate(-8 470 93)"/>
  <rect x="459" y="78" width="16" height="3.5" rx="1.75" fill="#93c5fd" transform="rotate(-8 470 93)"/>
  <rect x="476" y="66" width="38" height="48" rx="5" fill="#fff" stroke="#e2e8f0" stroke-width="1.5" transform="rotate(7 495 90)"/>
  <text x="482" y="82" font-size="7" font-weight="800" fill="#b91c1c" transform="rotate(7 495 90)">CV.pdf</text>
  <rect x="482" y="88" width="24" height="3" rx="1.5" fill="#e2e8f0" transform="rotate(7 495 90)"/>
  <rect x="482" y="95" width="18" height="3" rx="1.5" fill="#e2e8f0" transform="rotate(7 495 90)"/>
  <g filter="url(#sh)">
    <path d="M440 112 h26 l8 12 h28 l8 -12 h26 v30 a12 12 0 0 1 -12 12 h-72 a12 12 0 0 1 -12 -12 z" fill="url(#g2)"/>
  </g>
  <text x="488" y="146" font-size="9" font-weight="800" fill="#fff" text-anchor="middle">Applicants</text>
  <circle cx="530" cy="84" r="11" fill="#f59e0b" stroke="#fff" stroke-width="3"/>
  <text x="530" y="88" font-size="10" font-weight="800" fill="#fff" text-anchor="middle">!</text>
  <text x="488" y="184" font-size="10" font-weight="700" fill="#4338ca" text-anchor="middle">3 · Resumes reach you</text>

  <!-- sparkles -->
  <path d="M226 140 l3 -8 l3 8 l8 3 l-8 3 l-3 8 l-3 -8 l-8 -3 z" fill="#a78bfa"/>
  <path d="M424 26 l2 -6 l2 6 l6 2 l-6 2 l-2 6 l-2 -6 l-6 -2 z" fill="#f472b6"/>
  <path d="M20 24 l2 -6 l2 6 l6 2 l-6 2 l-2 6 l-2 -6 l-6 -2 z" fill="#60a5fa"/>
  <circle cx="232" cy="104" r="3" fill="#c4b5fd"/><circle cx="420" cy="160" r="3.5" fill="#f9a8d4"/>
</svg>
